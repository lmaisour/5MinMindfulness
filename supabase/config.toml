# Minimal Supabase CLI project config.
# Link with: supabase link --project-ref YOUR_PROJECT_REF

project_id = "5minmindfulness"

[api]
enabled = true

[db]
# Hosted project is Postgres 17. Local CLI diffs should use the same major version.
major_version = 17

[auth]
enabled = true
enable_anonymous_sign_ins = true

[functions.delete-account]
verify_jwt = true
